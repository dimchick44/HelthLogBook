services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medarchive
      POSTGRES_PASSWORD: medarchive
      POSTGRES_DB: medarchive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medarchive"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/medarchive || true;
      exit 0;
      "

  api:
    build: ../apps/api
    environment:
      MEDARCHIVE_ENVIRONMENT: dev
      MEDARCHIVE_DATABASE_URL: postgresql+asyncpg://medarchive:medarchive@db:5432/medarchive
      MEDARCHIVE_JWT_SECRET: dev-only-change-me
      MEDARCHIVE_SECRET_ENCRYPTION_KEY: dev-only-stable-key
      MEDARCHIVE_STORAGE_BACKEND: s3
      MEDARCHIVE_S3_ENDPOINT: http://minio:9000
      MEDARCHIVE_S3_BUCKET: medarchive
      MEDARCHIVE_S3_ACCESS_KEY: minioadmin
      MEDARCHIVE_S3_SECRET_KEY: minioadmin
      MEDARCHIVE_S3_REGION: ru-central1
      MEDARCHIVE_AUTO_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  smtp:
    build: ../apps/api
    environment:
      MEDARCHIVE_DATABASE_URL: postgresql+asyncpg://medarchive:medarchive@db:5432/medarchive
      MEDARCHIVE_JWT_SECRET: dev-only-change-me
      MEDARCHIVE_STORAGE_BACKEND: s3
      MEDARCHIVE_S3_ENDPOINT: http://minio:9000
      MEDARCHIVE_S3_BUCKET: medarchive
      MEDARCHIVE_S3_ACCESS_KEY: minioadmin
      MEDARCHIVE_S3_SECRET_KEY: minioadmin
      MEDARCHIVE_S3_REGION: ru-central1
      MEDARCHIVE_SMTP_HOST: 0.0.0.0
      MEDARCHIVE_SMTP_PORT: "8025"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "8025:8025"
    command: ["python", "-m", "app.smtp_server"]

volumes:
  pgdata:
  miniodata:
