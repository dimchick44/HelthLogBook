[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medarchive-api"
version = "0.1.0"
description = "MedArchive backend: auth, documents, mail ingest, inbox sync"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "aiosqlite==0.20.0",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "pydantic-settings==2.7.0",
  "email-validator==2.2.0",
  "pyjwt==2.10.1",
  "python-multipart==0.0.20",
  "aiosmtpd==1.4.6",
  "aioimaplib==2.0.3",
  "cryptography==50.0.2",
  "boto3==1.35.90",
  "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
